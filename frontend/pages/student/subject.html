<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS — Subject</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="student.css">
</head>
<body class="app-layout">

    <aside class="sidebar">
        <div class="sidebar-logo">LMS</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link">My Subjects</a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn btn-secondary btn-sm btn-block" id="logout-btn">Logout</button>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="navbar">
            <span class="navbar-title" id="subject-name">Subject</span>
            <div class="navbar-right">
                <span class="navbar-user" id="navbar-user"></span>
            </div>
        </header>

        <main class="main-content">
            <div class="page-body">

                <div class="page-header">
                    <div class="page-header-left">
                        <h1 id="page-subject-name">Subject</h1>
                        <p id="page-batch-name"></p>
                    </div>
                    <a href="dashboard.html" class="btn btn-secondary">← Back</a>
                </div>

                <div id="subject-tabs" class="tab-bar">
                    <button class="tab-btn" data-tab="tab-notes">Notes</button>
                    <button class="tab-btn" data-tab="tab-videos">Videos</button>
                    <button class="tab-btn" data-tab="tab-doubts">My Doubts</button>
                </div>

                <!-- Notes Tab -->
                <section class="tab-panel" id="tab-notes">
                    <div id="notes-list">
                        <p class="table-empty">Loading…</p>
                    </div>
                </section>

                <!-- Videos Tab -->
                <section class="tab-panel" id="tab-videos">
                    <div id="videos-list">
                        <p class="table-empty">Loading…</p>
                    </div>
                </section>

                <!-- Doubts Tab -->
                <section class="tab-panel" id="tab-doubts">
                    <div class="raise-doubt-area">
                        <h3>Raise a Doubt</h3>
                        <div class="form-group">
                            <textarea class="form-input" id="doubt-text" rows="4"
                                      placeholder="Describe your doubt in detail…"></textarea>
                        </div>
                        <button class="btn btn-primary" id="submit-doubt-btn">Submit Doubt</button>
                    </div>

                    <h3 class="section-heading">My Doubts</h3>
                    <div id="doubts-list">
                        <p class="table-empty">Loading…</p>
                    </div>
                </section>

            </div>
        </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="subject.js"></script>
</body>
</html>
